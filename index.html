<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mutuini High School Valentine 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="floating-hearts"></div>

<header class="hero">
    <img src="logo.png" class="logo" alt="Mutuini Logo">
    <h1 id="typewriter"></h1>
    <h2>From All of Us at Mutuini High School</h2>
    <button class="celebrate-btn" onclick="launchConfetti()">Celebrate! 🎉</button>
</header>

<section class="appreciation">
    <h2>Show Some Love 💖</h2>
    <div class="cards">
        <div class="card" onclick="showAppreciation('students')">Students</div>
        <div class="card" onclick="showAppreciation('teachers')">Teachers</div>
        <div class="card" onclick="showAppreciation('staff')">Non-Teaching Staff</div>
    </div>
    <div id="appreciationText"></div>
</section>

<section class="compliment">
    <h2>Sweet Messages for Everyone</h2>
    <button onclick="generateCompliment()">Get a Sweet Message 💌</button>
    <p id="compliment"></p>
</section>

<section class="gallery">
    <h2>School Memories 📸</h2>
    <div class="gallery-grid">
        <img src="photo1.jpg" alt="Memory 1">
        <img src="photo2.jpg" alt="Memory 2">
        <img src="photo3.jpg" alt="Memory 3">
    </div>
</section>

<section class="wall">
    <h2>Leave a Kind Message 📝</h2>
    <input type="text" id="name" placeholder="Your Name">
    <textarea id="note" placeholder="Write something sweet..."></textarea>
    <button onclick="addMessage()">Post Message 💖</button>
    <div id="messages"></div>
</section>

<footer>
    <p>Mutuini High School — Unity, Respect, and Love ❤️</p>
    <button onclick="document.getElementById('bgMusic').play()">Play Music 🎵</button>
</footer>

<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>
</body>
</html>
