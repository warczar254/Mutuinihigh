<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mutuini High School Valentine Wall</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(-45deg,#0033cc,#ff4da6,#8000ff,#800000,#009966);
background-size:400% 400%;
animation:bgMove 12s ease infinite;
color:white;
overflow-x:hidden;
text-align:center;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

header{
padding:40px 20px;
}

header h1{
font-size:2rem;
}

.glass{
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
border-radius:20px;
padding:25px;
width:95%;
max-width:850px;
margin:20px auto;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.templates button{
margin:5px;
padding:8px 14px;
border:none;
border-radius:20px;
cursor:pointer;
background:white;
color:#800000;
font-size:0.8rem;
transition:0.3s;
}

.templates button:hover{
transform:scale(1.1);
}

input,textarea{
width:100%;
padding:12px;
margin-top:12px;
border-radius:12px;
border:none;
outline:none;
font-size:1rem;
}

button.submitBtn{
margin-top:15px;
padding:12px;
width:100%;
border:none;
border-radius:12px;
font-weight:600;
cursor:pointer;
background:linear-gradient(90deg,#ff0055,#ff66cc,#6600ff);
color:white;
transition:0.3s;
}

button.submitBtn:hover{
transform:scale(1.05);
}

/* Message Card */
.msg{
background:white;
color:#333;
padding:20px;
border-radius:15px;
margin:20px auto;
width:95%;
max-width:850px;
box-shadow:0 5px 20px rgba(0,0,0,0.2);
animation:fadeUp 0.6s ease;
text-align:left;
}

.msg strong{
color:#800000;
font-size:1rem;
}

.msg p{
margin-top:8px;
line-height:1.6;
font-size:0.95rem;
}

.likeBtn{
margin-top:10px;
padding:6px 12px;
border:none;
border-radius:20px;
cursor:pointer;
background:#ff4da6;
color:white;
transition:0.3s;
}

.likeBtn:hover{
transform:scale(1.15);
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

/* 3D Reaction */
.reaction3D{
position:fixed;
font-size:28px;
animation:explode 1s ease forwards;
}

@keyframes explode{
0%{transform:scale(1) rotate(0deg);opacity:1;}
100%{transform:scale(2.5) rotate(360deg) translateY(-80px);opacity:0;}
}

/* Flying hearts */
.heart{
position:fixed;
bottom:-20px;
font-size:20px;
animation:floatUp 6s linear infinite;
}

@keyframes floatUp{
0%{transform:translateY(0);}
100%{transform:translateY(-110vh);}
}

/* Flowers */
.flower{
position:fixed;
top:-20px;
font-size:18px;
animation:fall 10s linear infinite;
}

@keyframes fall{
0%{transform:translateY(0);}
100%{transform:translateY(110vh);}
}

@media(max-width:600px){
header h1{font-size:1.4rem;}
.msg p{font-size:0.9rem;}
}
</style>
</head>

<body>

<header>
<h1>🌹 Mutuini High School Valentine Appreciation Wall 🌹</h1>
<p>Share love, unity and appreciation this Valentine season.</p>
</header>

<div class="glass">

<h3>Quick Message Templates</h3>
<div class="templates">
<button onclick="fillTemplate(1)">To Principal</button>
<button onclick="fillTemplate(2)">To Teachers</button>
<button onclick="fillTemplate(3)">To Students</button>
<button onclick="fillTemplate(4)">To Staff</button>
</div>

<form id="messageForm">
<input type="text" id="name" placeholder="Your Name" required>
<textarea id="message" placeholder="Write your Valentine message..." required></textarea>
<button type="submit" class="submitBtn">Send Love 💌</button>
</form>

</div>

<div id="messages"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, increment }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* Replace with your config */
const firebaseConfig = {
apiKey:"YOUR_API_KEY",
authDomain:"YOUR_PROJECT.firebaseapp.com",
projectId:"YOUR_PROJECT_ID",
storageBucket:"YOUR_PROJECT.appspot.com",
messagingSenderId:"YOUR_ID",
appId:"YOUR_APP_ID"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const form=document.getElementById("messageForm");
const messagesDiv=document.getElementById("messages");

form.addEventListener("submit",async(e)=>{
e.preventDefault();
const name=document.getElementById("name").value.trim();
const message=document.getElementById("message").value.trim();

if(name && message){
await addDoc(collection(db,"messages"),{
name,
message,
likes:0,
createdAt:new Date()
});
form.reset();
reaction3D();
}
});

const q=query(collection(db,"messages"),orderBy("createdAt","desc"));

onSnapshot(q,(snapshot)=>{
messagesDiv.innerHTML="";
snapshot.forEach(docSnap=>{
const data=docSnap.data();
messagesDiv.innerHTML+=`
<div class="msg">
<strong>${data.name}</strong>
<p>${data.message}</p>
<button class="likeBtn" onclick="likeMsg('${docSnap.id}')">
❤️ ${data.likes || 0}
</button>
</div>
`;
});
});

window.likeMsg=async function(id){
const ref=doc(db,"messages",id);
await updateDoc(ref,{likes:increment(1)});
reaction3D();
};

/* Templates */
window.fillTemplate=function(type){
const msg=document.getElementById("message");
if(type===1){
msg.value="To our Principal, your leadership, dedication and wisdom continue to guide Mutuini High School toward excellence. We deeply appreciate your strength and commitment.";
}
if(type===2){
msg.value="To our Teachers, thank you for shaping our future with patience, knowledge and inspiration. Your guidance means everything.";
}
if(type===3){
msg.value="To my fellow students, may we continue supporting one another, building friendships and growing together in unity and love.";
}
if(type===4){
msg.value="To our hardworking staff, your dedication keeps our school running smoothly. We appreciate your effort and silent strength.";
}
reaction3D();
};

/* 3D reaction */
function reaction3D(){
for(let i=0;i<5;i++){
const r=document.createElement("div");
r.className="reaction3D";
r.style.left=Math.random()*100+"vw";
r.style.top=Math.random()*80+"vh";
r.innerHTML=["💖","💐","🌹","❤️"][Math.floor(Math.random()*4)];
document.body.appendChild(r);
setTimeout(()=>r.remove(),1000);
}
}

/* Flying hearts */
setInterval(()=>{
const heart=document.createElement("div");
heart.className="heart";
heart.style.left=Math.random()*100+"vw";
heart.innerHTML="💖";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),6000);
},1000);

/* Falling flowers */
setInterval(()=>{
const flower=document.createElement("div");
flower.className="flower";
flower.style.left=Math.random()*100+"vw";
flower.innerHTML="🌸";
document.body.appendChild(flower);
setTimeout(()=>flower.remove(),10000);
},2000);

</script>

</body>
</html>
